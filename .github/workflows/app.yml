name: app
on:
  push: { paths: ['app/**'] }
  pull_request: { paths: ['app/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: stable }
      - run: flutter create --org com.spider --project-name spider_mind --platforms=android,ios,web . 
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: bash tool/configure_android.sh
      - run: flutter build apk --debug
